# Android entry point for the Gnosis VPN client. Copied into a gnosis_vpn-client checkout as a
# workspace member (members = ["gnosis_vpn*"]) so it builds against the client's pinned Cargo.lock.
[package]
edition      = { workspace = true }
license      = { workspace = true }
name         = "gnosis_vpn-android"
publish      = false
rust-version = { workspace = true }
version      = { workspace = true }

[lib]
crate-type = ["cdylib"]
name       = "gnosisvpn"

[dependencies]
gnosis_vpn-ipc     = { path = "../gnosis_vpn-ipc" }
gnosis_vpn-lib     = { path = "../gnosis_vpn-lib" }
jni                = "0.22"
jni-sys            = "0.4"
# Android TLS: reqwest verifies certificates through Android's trust store via JNI.
rustls-platform-verifier = "0.7"
tokio.workspace    = true
tracing.workspace  = true
serde_json.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
url.workspace      = true
