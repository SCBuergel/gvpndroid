# Memory limits: this machine has 8 GB shared with many other processes.
# One build JVM capped at 1.5 GB heap, no lingering daemon, one worker,
# Kotlin compiled inside the Gradle JVM instead of a separate Kotlin daemon.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
